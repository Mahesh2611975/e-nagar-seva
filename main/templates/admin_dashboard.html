{% extends 'base.html' %}
{% block content %}

<style>
.content {
    padding: 20px;
}

/* TABLE */
table {
    width: 100%;
    margin-top: 20px;
    border-collapse: collapse;
    background: white;
    border-radius: 10px;
    overflow: hidden;
}

th {
    background: #4facfe;
    color: white;
    padding: 12px;
}

td {
    padding: 10px;
    text-align: center;
}

tr:nth-child(even) {
    background: #f5f5f5;
}

/* BUTTON */
.btn {
    padding: 6px 10px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    color: white;
}

.assign { background: #3f51b5; }
.delete { background: red; }

</style>

<div class="content">

<h2>🛠 Admin Dashboard</h2>

<table>
<tr>
    <th>ID</th>
    <th>Image</th>
    <th>User</th>
    <th>Category</th>
    <th>Status</th>
    <th>Assign Officer</th>
    <th>Delete</th>
</tr>

{% for c in complaints %}
<tr>

    <td>{{ c.id }}</td>

    <td><img src="{{ c.image.url }}" width="60"></td>

    <td>{{ c.user.username }}</td>

    <td>{{ c.get_category_display }}</td>

    <td>{{ c.status }}</td>

    <!-- ASSIGN -->
    <td>
        <form method="POST" action="{% url 'assign_officer' c.id %}">
            {% csrf_token %}
            <select name="officer">
                {% for o in officers %}
                    <option value="{{ o.id }}">{{ o.username }}</option>
                {% endfor %}
            </select>
            <button class="btn assign">Assign</button>
        </form>
    </td>

    <!-- DELETE -->
    <td>
        <a href="{% url 'delete_complaint' c.id %}" class="btn delete">
            Delete
        </a>
    </td>

</tr>
{% endfor %}
</table>

</div>

{% endblock %}
