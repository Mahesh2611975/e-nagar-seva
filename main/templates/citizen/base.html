<!DOCTYPE html>
<html>
<head>
    <title>E-Nagar Seva</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>

    body {
        margin: 0;
        font-family: Arial;
        display: flex;
        background: #f4f6f9;
    }

    /* 🔥 SIDEBAR */
    .sidebar {
        width: 230px;
        height: 100vh;
        background: #2c3e50;
        color: white;
        position: fixed;
        overflow-y: auto;
    }

    .sidebar h2 {
        text-align: center;
        padding: 20px;
        margin: 0;
        background: #1a252f;
    }

    .sidebar a {
        display: block;
        padding: 15px 20px;
        color: white;
        text-decoration: none;
        transition: 0.2s;
    }

    .sidebar a:hover {
        background: #34495e;
    }

    /* 📄 MAIN */
    .main {
        margin-left: 230px;
        width: 100%;
        padding: 20px;
    }

    /* 🌙 DARK MODE */
    .dark {
        background: #121212;
        color: white;
    }

    .dark .sidebar {
        background: #1f1f1f;
    }

    .dark .sidebar h2 {
        background: #111;
    }

    .dark table {
        background: #1e1e1e;
        color: white;
    }

    /* 🔘 TOGGLE */
    .toggle {
        position: absolute;
        top: 15px;
        right: 20px;
    }

    </style>
</head>

<body>

<!-- 🔥 SIDEBAR -->
<div class="sidebar">

    <h2>🏙 E-Nagar</h2>

    <!-- COMMON DASHBOARD -->
    <a href="{% url 'dashboard' %}">
        <i class="fa fa-home"></i> Dashboard
    </a>

    <!-- 👤 CITIZEN ONLY -->
    {% if request.user.profile.role == 'citizen' %}
        <a href="{% url 'complaint' %}">
            <i class="fa fa-plus"></i> Add Complaint
        </a>
    {% endif %}

    <!-- 🔔 COMMON -->
    <a href="{% url 'notifications' %}">
        <i class="fa fa-bell"></i> Notifications
    </a>

    <!-- 👮 + 🛠 COMBINED STAFF DASHBOARD -->
    {% if request.user.profile.role == 'officer' or request.user.is_staff %}
        <a href="{% url 'staff_dashboard' %}">
            <i class="fa fa-user-shield"></i> Staff Panel
        </a>
    {% endif %}

    <!-- LOGOUT -->
    <a href="{% url 'logout' %}">
        <i class="fa fa-sign-out"></i> Logout
    </a>

</div>

<!-- 📄 MAIN -->
<div class="main">

    <!-- 🌙 DARK MODE -->
    <div class="toggle">
        🌙 <input type="checkbox" id="darkToggle">
    </div>

    {% block content %}
    {% endblock %}

</div>

<!-- 🌙 DARK MODE SCRIPT -->
<script>
const toggle = document.getElementById("darkToggle");

// Load saved mode
if(localStorage.getItem("darkMode") === "on"){
    document.body.classList.add("dark");
    toggle.checked = true;
}

toggle.addEventListener("change", () => {
    document.body.classList.toggle("dark");

    if(document.body.classList.contains("dark")){
        localStorage.setItem("darkMode", "on");
    } else {
        localStorage.setItem("darkMode", "off");
    }
});
</script>

</body>
</html>
